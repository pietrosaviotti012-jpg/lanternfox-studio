# Renders a production in the cloud, split across machines so it takes minutes, not an hour:
#   voice (1 machine) → frames (6 machines at once, one slice each) → finish (join, music, mix, release, Office).
# GitHub gives public repositories free runners and up to 20 jobs at a time; without a GPU each machine draws in
# software, so more machines is what makes it fast.
# Starts when a production gets its READY file, or by hand (Actions → render → Run workflow).
name: render

on:
  push:
    branches: [main]
    paths: ['productions/**/READY']
  workflow_dispatch:
    inputs:
      production:
        description: 'Production folder, e.g. productions/2026-10-28-lighthouse-fox'
        required: true

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

env:
  LEMO_COMMIT: 413a6bd6d78ebd3bdd5abaec9538a26867f890df
  OFFICE_URL: ${{ secrets.OFFICE_URL }}
  STUDIO_SECRET: ${{ secrets.STUDIO_SECRET }}
  HF_HOME: /home/runner/.cache/huggingface
  Q: ${{ vars.RENDER_Q || 'ssaa=1&dof=12&msaa=0&shadowmap=512&bloomres=.5' }}
  PLAYWRIGHT_CHROME: /usr/bin/google-chrome   # preinstalled on GitHub's runners
  SLICES: 6

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      dir: ${{ steps.which.outputs.dir }}
      id: ${{ steps.which.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Which production
        id: which
        run: |
          if [ -n "${{ inputs.production }}" ]; then P="${{ inputs.production }}"; else
            P=$(git diff --name-only HEAD^ HEAD | grep '^productions/.*/READY$' | head -1 | xargs dirname); fi
          [ -f "$P/script.json" ] || { echo "no script.json in '$P'"; exit 1; }
          echo "dir=$P" >> "$GITHUB_OUTPUT"; echo "id=$(basename "$P")" >> "$GITHUB_OUTPUT"; echo "Production: $P"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: ffmpeg (static build)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
      - name: Python packages (CPU)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r tools/requirements.txt
      - name: Voice models cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-chatterbox-whisper-v1
      - name: Voce
        run: |
          node tools/office.mjs '{"dept":"voce","status":"working","task":"Registro il narratore riga per riga"}'
          python tools/voice.py "${{ steps.which.outputs.dir }}" || { node tools/office.mjs '{"dept":"voce","status":"error","task":"Una riga non si capisce: va riscritta"}'; exit 1; }
          node tools/office.mjs '{"dept":"voce","status":"done","task":"Narrazione pronta e controllata"}' '{"dept":"animazione","status":"working","task":"Disegno i fotogrammi su 6 macchine insieme"}'
      - uses: actions/upload-artifact@v4
        with:
          name: vo
          path: ${{ steps.which.outputs.dir }}/vo
          retention-days: 3

  frames:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        slice: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg (static build)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
      - name: Lemo-Opuscar library (pinned)
        run: |
          git clone -q https://github.com/lemomo-ai/lemo-opuscar.git ~/lemo-opuscar
          cd ~/lemo-opuscar && git checkout -q "$LEMO_COMMIT" && npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: vo
          path: ${{ needs.voice.outputs.dir }}/vo
      - name: Slice ${{ matrix.slice }}
        env:
          P: ${{ needs.voice.outputs.dir }}
        run: |
          rm -rf "$P/engine"; cp -r engine "$P/engine"; cp engine/index.html "$P/index.html"
          node tools/segment.mjs "$P" ${{ matrix.slice }} "$SLICES" 30 "segs/seg_${{ matrix.slice }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.slice }}
          path: segs/seg_${{ matrix.slice }}.mp4
          retention-days: 3

  finish:
    needs: [voice, frames]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg (static build)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C /tmp
          echo /tmp/ffmpeg-master-latest-linux64-gpl/bin >> "$GITHUB_PATH"
      - name: Lemo-Opuscar library (pinned) and mixing packages
        run: |
          git clone -q https://github.com/lemomo-ai/lemo-opuscar.git ~/lemo-opuscar
          cd ~/lemo-opuscar && git checkout -q "$LEMO_COMMIT" && npm ci --no-audit --no-fund
          pip install -q numpy scipy soundfile
      - uses: actions/download-artifact@v4
        with:
          name: vo
          path: ${{ needs.voice.outputs.dir }}/vo
      - uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: segs
          merge-multiple: true
      - name: Join, music, mix
        env:
          SEGMENTS: ${{ github.workspace }}/segs
          PY: python
        run: sh tools/build.sh "${{ needs.voice.outputs.dir }}"
      - name: Release (public link for the platforms)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          P: ${{ needs.voice.outputs.dir }}
          ID: ${{ needs.voice.outputs.id }}
        run: |
          TITLE=$(node -e "console.log(require('./$P/meta.json').title)")
          gh release delete "film-$ID" --yes --cleanup-tag 2>/dev/null || true
          gh release create "film-$ID" "$P/out/film.mp4" "$P/out/poster.jpg" "$P/out/cover.jpg" "$P/out/sheet.jpg" "$P/out/film.srt" --title "$TITLE" --notes "Lantern Fox Tales · $ID"
          echo "base=https://github.com/${{ github.repository }}/releases/download/film-$ID" >> "$GITHUB_OUTPUT"
      - name: To the Office for approval
        env:
          P: ${{ needs.voice.outputs.dir }}
          ID: ${{ needs.voice.outputs.id }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          node -e "
            const m = require('./' + process.env.P + '/meta.json');
            const caption = m.caption + '\n\n' + (m.hashtags || []).join(' ');
            console.log(JSON.stringify({ queue: { id: process.env.ID, title: m.title, caption, platforms: ['Instagram', 'YouTube', 'TikTok'],
              preview_url: process.env.BASE + '/film.mp4', cover_url: process.env.BASE + '/cover.jpg', request: m.request } }));
          " > queue.json
          node tools/office.mjs "$(cat queue.json)" '{"dept":"revisione","status":"waiting","task":"Il video è pronto: guardalo e scegli"}'
